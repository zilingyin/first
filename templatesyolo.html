<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO 实时检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .video-container {
            text-align: center;
            margin-bottom: 16px;
        }

        video, #resultImg img {
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            max-width: 100%;
            display: none;
        }

            video.active, #resultImg img.active {
                display: inline-block;
            }

        .placeholder {
            width: 100%;
            height: 360px;
            border-radius: 12px;
            border: 2px dashed rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 1.1rem;
        }

        .btn-group {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 1rem;
            transition: background 0.2s;
        }

            .btn:hover {
                background: #d93852;
            }

            .btn:disabled {
                background: #666;
                cursor: not-allowed;
                opacity: 0.6;
            }

        .status {
            text-align: center;
            margin: 10px 0;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

            .status.info {
                background: rgba(52, 152, 219, 0.2);
            }

            .status.success {
                background: rgba(46, 204, 113, 0.2);
            }

            .status.error {
                background: rgba(231, 76, 60, 0.2);
            }

        .results {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

            .results h3 {
                margin-bottom: 12px;
            }

        .detection-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .detection-item:last-child {
                border-bottom: none;
            }

        .detection-label {
            font-weight: bold;
        }

        .detection-conf {
            color: #2ecc71;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #e94560;
            text-decoration: none;
            font-size: 1rem;
        }

            .back:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO 实时目标检测</h1>
        <p class="subtitle">基于 YOLOv8n · 本地 GPU 加速 · 实时推理</p>

        <div class="video-container">
            <div class="placeholder" id="placeholder">点击"开启摄像头"开始</div>
            <video id="video" width="800" height="450" autoplay muted playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="resultImg"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="btnCamera" onclick="startCamera()">📷 开启摄像头</button>
            <button class="btn" id="btnDetect" onclick="detectOnce()" disabled>🔍 检测一帧</button>
            <button class="btn" id="btnRealtime" onclick="startRealtime()" disabled>▶️ 连续检测</button>
            <button class="btn" id="btnStop" onclick="stopRealtime()" disabled>⏹️ 停止</button>
        </div>

        <div class="status info" id="status">就绪</div>

        <div class="results" id="results">
            <h3>检测结果</h3>
            <p style="opacity:0.7;">点击"检测一帧"开始检测...</p>
        </div>

        <a class="back" href="/">← 返回聊天助手</a>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultImg = document.getElementById('resultImg');
        const placeholder = document.getElementById('placeholder');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');

        const btnCamera = document.getElementById('btnCamera');
        const btnDetect = document.getElementById('btnDetect');
        const btnRealtime = document.getElementById('btnRealtime');
        const btnStop = document.getElementById('btnStop');

        let realtimeTimer = null;
        let isProcessing = false;

        function setStatus(msg, type = 'info') {
        statusEl.textContent = msg;
        statusEl.className = `status ${type}`;
        }

        async function startCamera() {
        try {
        const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.classList.add('active');
        placeholder.style.display = 'none';

        btnDetect.disabled = false;
        btnRealtime.disabled = false;
        btnCamera.disabled = true;

        setStatus('✅ 摄像头已开启', 'success');
        } catch (err) {
        setStatus('❌ 无法访问摄像头: ' + err.message, 'error');
        console.error(err);
        }
        }

        async function detectOnce() {
        if (isProcessing) return;
        if (!video.srcObject) {
        setStatus('⚠️ 请先开启摄像头', 'error');
        return;
        }

        isProcessing = true;
        btnDetect.disabled = true;
        setStatus('⏳ 正在检测...', 'info');

        try {
        // 将视频帧绘制到 canvas
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 转为 base64
        const imageData = canvas.toDataURL('image/jpeg', 0.85);

        // 发送到后端
        const resp = await fetch('api/yolo/detect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData })
        });

        const data = await resp.json();

        if (!resp.ok || data.error) {
        throw new Error(data.error || `HTTP ${resp.status}`);
        }

        // 显示检测结果图片
        resultImg.innerHTML = `<img src="${data.image}" class="active" style="max-width:100%;border-radius:12px;">`;
        video.classList.remove('active');

        // 显示检测列表
        if (data.count > 0) {
        let html = `<h3>检测结果（${data.count} 个目标）</h3>`;
        data.detections.forEach(d => {
        html += `
        <div class="detection-item">
        <span class="detection-label">${d.label}</span>
        <span class="detection-conf">${(d.confidence * 100).toFixed(1)}%</span>
        </div>
        `;
        });
        resultsEl.innerHTML = html;
        setStatus(`✅ 检测到 ${data.count} 个目标`, 'success');
        } else {
        resultsEl.innerHTML = '<h3>检测结果</h3><p style="opacity:0.7;">未检测到目标，请调整角度或光线后重试</p>';
        setStatus('⚠️ 未检测到目标', 'info');
        }

        } catch (err) {
        setStatus('❌ 检测失败: ' + err.message, 'error');
        console.error(err);
        } finally {
        isProcessing = false;
        if (realtimeTimer === null) {
        btnDetect.disabled = false;
        }
        }
        }

        function startRealtime() {
        if (realtimeTimer) return;

        btnRealtime.disabled = true;
        btnStop.disabled = false;
        setStatus('▶️ 连续检测中...', 'info');

        // 先检测一帧
        detectOnce();
        // 每 800ms 检测一次
        realtimeTimer = setInterval(detectOnce, 800);
        }

        function stopRealtime() {
        if (realtimeTimer) {
        clearInterval(realtimeTimer);
        realtimeTimer = null;
        }
        btnRealtime.disabled = false;
        btnStop.disabled = true;
        btnDetect.disabled = false;

        // 恢复视频画面
        video.classList.add('active');
        resultImg.innerHTML = '';

        setStatus('⏹️ 已停止连续检测', 'info');
        }
    </script>
</body>
</html>
