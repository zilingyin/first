<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YOLO 实时检测</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 30px; }
        .video-container {
            text-align: center;
            margin-bottom: 20px;
        }
        video, canvas, #resultImg {
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            max-width: 100%;
        }
        .btn-group { text-align: center; margin: 20px 0; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 1rem;
        }
        .btn:hover { background: #d93852; }
        .results {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .results h3 { margin-bottom: 10px; }
        .detection-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back { display: block; text-align: center; margin-top: 20px; color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO 实时目标检测</h1>
        <p class="subtitle">基于 YOLOv8n · 本地 GPU 加速 · 实时推理</p>

        <div class="video-container">
            <video id="video" width="800" height="450" autoplay muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="resultImg" style="display:none;"></div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="startCamera()">📷 开启摄像头</button>
            <button class="btn" onclick="detectOnce()">🔍 检测一帧</button>
            <button class="btn" onclick="startRealtime()">▶️ 连续检测</button>
            <button class="btn" onclick="stopRealtime()">⏹️ 停止</button>
        </div>

        <div class="results" id="results">
            <h3>检测结果</h3>
            <p>点击"检测一帧"开始...</p>
        </div>

        <a class="back" href="/">← 返回聊天助手</a>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let realtimeTimer = null;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 800, height: 450 } });
                video.srcObject = stream;
            } catch (err) {
                alert('无法访问摄像头: ' + err.message);
            }
        }

        function detectOnce() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            fetch('/api/yolo/detect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('results').innerHTML = `<p style="color:#ff6b6b;">❌ ${data.error}</p>`;
                    return;
                }
                document.getElementById('resultImg').innerHTML = `<img src="${data.image}" style="max-width:100%;border-radius:12px;">`;
                document.getElementById('resultImg').style.display = 'block';

                let html = `<h3>检测结果（${data.count} 个目标）</h3>`;
                data.detections.forEach(d => {
                    html += `<div class="detection-item">${d.label} - ${(d.confidence * 100).toFixed(1)}%</div>`;
                });
                document.getElementById('results').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('results').innerHTML = `<p style="color:#ff6b6b;">❌ 检测失败</p>`;
            });
        }

        function startRealtime() {
            if (realtimeTimer) return;
            detectOnce(); // 先检测一帧
            realtimeTimer = setInterval(detectOnce, 800); // 每800ms
        }

        function stopRealtime() {
            if (realtimeTimer) {
                clearInterval(realtimeTimer);
                realtimeTimer = null;
            }
        }
    </script>
</body>
</html>
